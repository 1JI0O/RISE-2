robot_type: dual

data:
  type: teleop
  num_action: 20
  voxel_size: 0.005
  calib_timestamp: "20260104"

  sample_traj:
    enable: true
    trans_delta: 0.005
    rot_delta: 0.1309
    width_delta: 0.005

  normalization:
    # trans_min: [-0.9, -0.5, 0.6]
    # trans_max: [0.9, 0.75, 1.75]
    # trans_min: [-0.75, -0.75, 0.5]
    # trans_max: [0.8, 0.5, 1.5]
    trans_min: [-0.95, -0.95, 0.3]
    trans_max: [1.0, 0.7, 1.7]
    max_gripper_width: 0.1
    img_mean: [0.485, 0.456, 0.406]
    img_std: [0.229, 0.224, 0.225]

  aligner:
    img_size_resnet: [360, 640]
    img_size_dinov2: [252, 448]
    img_size_dinov3: [288, 512]
    img_coord_size_resnet: [12, 20]
    img_coord_size_dinov2: [18, 32]
    img_coord_size_dinov3: [18, 32]

  repeat_dataset: 1
  vis: false
  vis_save_dir: /data/haoxiang/logs/task0012-ca-pi-xie/vis_debug_train
  vis_save_ply: true
  vis_save_png: false
  vis_force_offscreen: true

train:
  workspace:
    # min: [-0.7, -0.3, 0.9]
    # max: [0.7, 0.55, 1.55]
    # min: [-0.9, -0.3, 0.9]
    # max: [0.9, 0.55, 1.55]
    # min: [-1.1, -0.5, 0.7]
    # max: [1.1, 0.75, 1.75]
    min: [-0.75, -0.75, 0.5]
    max: [0.8, 0.5, 1.5]

  augmentation:
    point: true
    aug_trans_min: [-0.2, -0.2, -0.2]
    aug_trans_max: [0.2, 0.2, 0.2]
    aug_rot_min: [-30, -30, -30]
    aug_rot_max: [30, 30, 30]

    color: true
    aug_color_params: [0.4, 0.4, 0.2, 0.1]
    aug_color_prob: 0.2

  lr: 0.0003
  batch_size: 180
  num_workers: 24
  num_steps: 80000
  save_steps: 2500
  num_warmup_steps: 2000
  seed: 233

  # lr: 0.0003          # 这个无所谓，反正你不训练
  # batch_size: 1       # 【关键】只看一个样本，秒出图
  # num_workers: 0      # 【关键】关闭多进程，防止可视化假死和报错刷屏
  # num_steps: 1        # 【关键】防止你关掉窗口后它真的开始训6万步
  # save_steps: 2500    # 无所谓
  # num_warmup_steps: 0 # 无所谓
  # seed: 233           # 保持不变，确保每次 debug 看到的数据是一样的

deploy:
  workspace:
    # min: [-0.7, -0.3, 0.9]
    # max: [0.7, 0.55, 1.55]
    # min: [-0.9, -0.3, 0.9]
    # max: [0.9, 0.55, 1.55]
    min: [-0.75, -0.75, 0.5]
    max: [0.8, 0.5, 1.5]
  agent:
    left_robot_serial: Rizon4-062703
    right_robot_serial: Rizon4R-062046
    left_gripper_port: /dev/ttyUSB0
    right_gripper_port: /dev/ttyUSB1
    camera_serial: "104122060902"
    gripper_key: width

  max_steps: 3000
  num_inference_steps: 20
  gripper_threshold: 0.02
  ensemble_mode: new
  seed: 233

  vis: true

mask_aware:
  enabled: false

model:
  image_enc: dinov2-base
  cloud_enc_dim: 128
  image_enc_dim: 128
  obs_feature_dim: 512
  hidden_dim: 512
  nheads: 8
  num_attn_layers: 4
  dim_feedforward: 2048
  dropout: 0.1
  interp_fn_mode: custom
  image_enc_finetune: lora
  image_enc_dtype: float32
