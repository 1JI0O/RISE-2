robot_type: single

data:
  type: teleop
  num_action: 20
  voxel_size: 0.005
  calib_timestamp: single_foar_purplebox

  sample_traj:
    enable: true
    trans_delta: 0.005
    rot_delta: 0.1309
    width_delta: 0.005

  normalization:
    trans_min: [-1.05, -0.70, 0.25]
    trans_max: [1.25, 0.75, 1.80]
    max_gripper_width: 0.1
    img_mean: [0.485, 0.456, 0.406]
    img_std: [0.229, 0.224, 0.225]

  aligner:
    img_size_resnet: [360, 640]
    img_size_dinov2: [252, 448]
    img_size_dinov3: [288, 512]
    img_coord_size_resnet: [12, 20]
    img_coord_size_dinov2: [18, 32]
    img_coord_size_dinov3: [18, 32]

  repeat_dataset: 1
  vis: false
  vis_force_offscreen: true

train:
  workspace:
    min: [-0.85, -0.50, 0.45]
    max: [1.05, 0.55, 1.60]

  augmentation:
    point: true
    aug_trans_min: [-0.2, -0.2, -0.2]
    aug_trans_max: [0.2, 0.2, 0.2]
    aug_rot_min: [-30, -30, -30]
    aug_rot_max: [30, 30, 30]

    color: true
    aug_color_params: [0.4, 0.4, 0.2, 0.1]
    aug_color_prob: 0.2

  lr: 0.0003
  batch_size: 160
  num_workers: 24
  num_steps: 60000
  save_steps: 2500
  num_warmup_steps: 2000
  seed: 233

deploy:
  workspace:
    min: [-0.85, -0.50, 0.45]
    max: [1.05, 0.55, 1.60]

  agent:
    robot_serial: Rizon4-062770
    camera_serial: "104422070117"
    inhand_camera_serial: unknown_inhand
    gripper_port: /dev/ttyUSB0
    gripper_key: width
    gripper_self_test: false

  max_steps: 3000
  num_inference_steps: 20
  gripper_threshold: 0.02
  ensemble_mode: new
  seed: 233
  vis: false

mask_aware:
  enabled: false
  mask_root: null
  align_mode: sorted_index
  enable_2d_reweight: true
  enable_3d_filter: true
  mask_threshold: 0
  mask_white_is_untrusted: true
  r_min: 0.001
  interp_eps: 0.000001
  interp_tiny: 0.000001
  empty_cloud_policy: warn_and_skip
  log_alignment_preview: false

model:
  image_enc: dinov2-base
  cloud_enc_dim: 128
  image_enc_dim: 128
  obs_feature_dim: 512
  hidden_dim: 512
  nheads: 8
  num_attn_layers: 4
  dim_feedforward: 2048
  dropout: 0.1
  interp_fn_mode: custom
  image_enc_finetune: full
  image_enc_dtype: float32
