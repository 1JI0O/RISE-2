robot_type: dual

data:
  type: teleop
  num_action: 20
  voxel_size: 0.005
  calib_timestamp: 1234567

  sample_traj:
    enable: true
    trans_delta: 0.005
    rot_delta: 0.1309
    width_delta: 0.005

  normalization:
    trans_min: [-0.95, -0.95, 0.3]
    trans_max: [1.0, 0.7, 1.7]
    max_gripper_width: 0.1
    img_mean: [0.485, 0.456, 0.406]
    img_std: [0.229, 0.224, 0.225]

  aligner:
    img_size_resnet: [360, 640]
    img_size_dinov2: [252, 448]
    img_size_dinov3: [288, 512]
    img_coord_size_resnet: [12, 20]
    img_coord_size_dinov2: [18, 32]
    img_coord_size_dinov3: [18, 32]

  repeat_dataset: 1
  vis: false
  vis_save_dir: /data/haoxiang/logs/task0012-ca-pi-xie/vis_debug_train
  vis_save_ply: true
  vis_save_png: false
  vis_force_offscreen: true

train:
  workspace:
    min: [-0.75, -0.75, 0.5]
    max: [0.8, 0.5, 1.5]

  augmentation:
    point: true
    aug_trans_min: [-0.2, -0.2, -0.2]
    aug_trans_max: [0.2, 0.2, 0.2]
    aug_rot_min: [-30, -30, -30]
    aug_rot_max: [30, 30, 30]

    color: true
    aug_color_params: [0.4, 0.4, 0.2, 0.1]
    aug_color_prob: 0.2

  lr: 0.0003
  batch_size: 180
  num_workers: 24
  num_steps: 80000
  save_steps: 2500
  num_warmup_steps: 2000
  seed: 233

deploy:
  workspace:
    min: [-20.0, -20.0, -20.0]
    max: [20.0, 20.0, 20.0]

  agent:
    left_robot_serial: Rizon4-062077
    right_robot_serial: Rizon4R-062016
    left_gripper_port: /dev/ttyUSB0
    right_gripper_port: /dev/ttyUSB1
    camera_serial: "104122060902"
    gripper_key: width

  max_steps: 3000
  num_inference_steps: 20
  gripper_threshold: 0.02
  ensemble_mode: new
  seed: 233

  vis: false

mask_aware:
  enabled: true
  enable_2d_reweight: true
  enable_3d_filter: true
  mask_threshold: 0
  mask_white_is_untrusted: true
  debug_save_mask: false
  debug_save_every: 10
  debug_dir: mask_debug_real
  debug_print_stats: true
  r_min: 0.001
  interp_eps: 0.000001
  interp_tiny: 0.000001
  empty_cloud_policy: warn_and_skip_filter

  # JSON mask 渲染参数（与 inspect_json_robot_render_inline.ipynb / render_json_separate_robot_completed.py 默认语义一致）
  json_mask:
    left_json: /data/haoxiang/data/task0012_260321/calib/left_global_20260104/result.json
    right_json: /data/haoxiang/data/task0012_260321/calib/right_global_20260104/result.json
    cam_base_mode: base_to_cam__predef

    # true: 使用实机相机内参；false: 从 intrinsics_npy 读取
    use_agent_intrinsics: true
    intrinsics_npy: null
    intrinsic_selector: first

    left_urdf: airexo/airexo/urdf_models/robot/left_robot_inhand.urdf
    right_urdf: airexo/airexo/urdf_models/robot/right_robot_inhand.urdf
    width: 1280
    height: 720
    near_plane: 0.01
    far_plane: 100.0

model:
  image_enc: dinov2-base
  cloud_enc_dim: 128
  image_enc_dim: 128
  obs_feature_dim: 512
  hidden_dim: 512
  nheads: 8
  num_attn_layers: 4
  dim_feedforward: 2048
  dropout: 0.1
  interp_fn_mode: custom
  image_enc_finetune: lora
  image_enc_dtype: float32
